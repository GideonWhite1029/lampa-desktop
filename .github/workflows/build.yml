name: Build And Publish App

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Ensure WiX Toolset v3 (for the MSI maker)
        shell: pwsh
        run: |
          $candle = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*\bin\candle.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $candle) {
            choco install wixtoolset --version=3.14.1 -y --no-progress
            $candle = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*\bin\candle.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          Add-Content $env:GITHUB_PATH $candle.Directory.FullName
          "WIX=$($candle.Directory.Parent.FullName)\" | Add-Content $env:GITHUB_ENV

      - run: npm ci

      - name: Build & publish
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish-x64-win32

      - name: Build only (PR)
        if: github.event_name == 'pull_request'
        run: npm run make-x64-win32

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lampa-windows
          path: out/**/make/**
          if-no-files-found: warn

  linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    env:
      LAMPA_SKIP_FLATPAK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install packaging tools (deb / rpm / AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot dpkg rpm libfuse2 squashfs-tools zsync

      - run: npm ci

      - name: Build & publish
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish-x64-linux

      - name: Build only (PR)
        if: github.event_name == 'pull_request'
        run: npm run make-x64-linux

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lampa-linux
          path: out/**/make/**
          if-no-files-found: warn
